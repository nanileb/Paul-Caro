# Mise en ligne automatique du site de Paul & Caroline à chaque fusion sur main.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN  : jeton Cloudflare, modèle « Edit Cloudflare Workers » + droit D1 « Edit »
#   CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-paul-caroline-wedding
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Migrations de la base D1
        run: npx wrangler d1 migrations apply paul-caroline-wedding --remote --env paul-caroline-wedding
      - name: Déploiement du Worker
        run: npx wrangler deploy --env paul-caroline-wedding
